name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'   # every day, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh cards and tournament data
        run: npm run fetch-data
      - name: Run tests
        run: npm test
      - name: Practice-game fuzz run
        run: node tests/game/fuzz.mjs 150
      - name: Save refreshed data
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "deckhand-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Daily data refresh"
            git pull --rebase -X theirs origin main && git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
